name: FlowKit Tests

on:
  push:
    branches: [master, improve/**]
  pull_request:
    branches: [master]

jobs:
  gut:
    name: GUT + smoke (Godot 4.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.6.1-stable-linux-v2

      - name: Download Godot 4.6.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v4.6.1-stable_linux.x86_64
          ln -sf ~/godot-bin/Godot_v4.6.1-stable_linux.x86_64 ~/godot-bin/godot

      - name: Link godot on PATH
        run: |
          chmod +x ~/godot-bin/Godot_v4.6.1-stable_linux.x86_64 || true
          ln -sf ~/godot-bin/Godot_v4.6.1-stable_linux.x86_64 ~/godot-bin/godot
          echo "$HOME/godot-bin" >> $GITHUB_PATH
          ~/godot-bin/godot --version

      # Import with hard timeout; empty main_scene reduces hang risk
      - name: Import project
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path . --import --quit-after 15
        timeout-minutes: 3

      - name: CI smoke (core classes + registry)
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path . -s res://tools/ci_smoke.gd
        timeout-minutes: 2

      - name: Run GUT unit tests
        run: |
          set -euo pipefail
          timeout 240 godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests \
            -ginclude_subdirs \
            -gexit \
            -glog=1
        timeout-minutes: 5

      - name: Generate provider matrix
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path . -s res://tools/generate_provider_matrix.gd
        timeout-minutes: 2

      - name: Verify matrix exists
        run: test -s docs/PROVIDER_MATRIX.md

      - name: Upload provider matrix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-matrix
          path: docs/PROVIDER_MATRIX.md
          if-no-files-found: ignore
